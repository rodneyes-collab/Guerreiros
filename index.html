
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerreiros Volleyball Club</title>
    <meta name="description" content="Guerreiros Volleyball Club v3.9.3 - Ranking ELO e Gestão de Sócios">
    <meta property="og:title" content="Guerreiros Volleyball Club">
    <meta property="og:description" content="Guerreiros Volleyball Club v3.9.3 - Ranking ELO e Gestão de Sócios">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
      // Global Gender runtime polyfill for mobile PWA standalone mode
      window.Gender = window.Gender || { MALE: 'MALE', FEMALE: 'FEMALE' };
      if (typeof globalThis !== 'undefined') {
        globalThis.Gender = globalThis.Gender || window.Gender;
      }
      if (typeof self !== 'undefined') {
        self.Gender = self.Gender || window.Gender;
      }
    </script>
</head>
<body class="bg-black text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Global error handler for legacy debugging
      window.onerror = function(msg, url, lineNo, columnNo) {
        console.error('[LegacyError]', msg, 'at', lineNo + ':' + columnNo);
        return false;
      };

      (function() {
        var EXPECTED_VERSION = '3.9.3';

        // Helper para comparar versões semânticas (ex: "3.9.0" >= "3.3.8")
        function isAtLeast(current, target) {
          if (!current || !target) return false;
          var cleanCur = String(current).replace(/^v/i, '').trim();
          var cleanTar = String(target).replace(/^v/i, '').trim();
          var c = cleanCur.split('.').map(function(n) { return parseInt(n, 10) || 0; });
          var t = cleanTar.split('.').map(function(n) { return parseInt(n, 10) || 0; });
          var len = Math.max(c.length, t.length);
          for (var x = 0; x < len; x++) {
            var cv = c[x] || 0;
            var tv = t[x] || 0;
            if (cv > tv) return true;
            if (cv < tv) return false;
          }
          return true; // Iguais
        }

        function runHtmlVersionCheck() {
          // Trava Anti-Loop: Se já atualizamos nesta sessão nos últimos 120s, nunca repetir o overlay!
          var lastUpdateTs = parseInt(sessionStorage.getItem('guerreiros_html_update_ts') || '0', 10);
          if (lastUpdateTs > 0 && (Date.now() - lastUpdateTs) < 120000) {
            return;
          }

          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/api/version?v=' + Date.now() + '&r=' + Math.random(), true);
          xhr.timeout = 5000;
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
              try {
                var data = JSON.parse(xhr.responseText);
                var serverVer = (data && data.version) ? String(data.version).trim() : EXPECTED_VERSION;

                // Se já confirmamos esta versão do servidor nesta sessão, está 100% atualizado
                var alreadyUpdatedToTarget = sessionStorage.getItem('guerreiros_html_update_target');
                if (alreadyUpdatedToTarget === serverVer) {
                  return;
                }

                var runningVersion = window.__RUNNING_APP_VERSION__;
                var confirmedVersion = sessionStorage.getItem('guerreiros_confirmed_version');
                var storedVersion = localStorage.getItem('guerreiros_app_version');
                var effectiveLocalVersion = runningVersion || confirmedVersion || storedVersion;

                // Se o bundle React ainda não terminou de definir a versão e é o primeiro acesso limpo,
                // grava a versão atual do servidor e não bloqueia a tela.
                if (!effectiveLocalVersion) {
                  sessionStorage.setItem('guerreiros_confirmed_version', serverVer);
                  localStorage.setItem('guerreiros_app_version', serverVer);
                  return;
                }

                var isUpToDate =
                  isAtLeast(runningVersion, serverVer) ||
                  isAtLeast(confirmedVersion, serverVer) ||
                  isAtLeast(storedVersion, serverVer);

                if (!isUpToDate) {
                  console.warn('[AutoUpdater] Atualizando de v' + effectiveLocalVersion + ' para v' + serverVer);

                  // Marca ANTES de limpar caches para jamais entrar em loop infinito
                  sessionStorage.setItem('guerreiros_html_update_ts', String(Date.now()));
                  sessionStorage.setItem('guerreiros_html_update_target', serverVer);
                  sessionStorage.setItem('guerreiros_confirmed_version', serverVer);
                  localStorage.setItem('guerreiros_app_version', serverVer);

                  // Desregistra Service Workers antigos
                  if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(regs) {
                      if (regs && regs.length > 0) {
                        for (var i = 0; i < regs.length; i++) {
                          regs[i].unregister();
                        }
                      }
                    });
                  }

                  // Limpa CacheStorage de arquivos estáticos antigos
                  if ('caches' in window && typeof caches.keys === 'function') {
                    caches.keys().then(function(names) {
                      if (names && names.length > 0) {
                        for (var j = 0; j < names.length; j++) {
                          caches.delete(names[j]);
                        }
                      }
                    });
                  }

                  var overlay = document.getElementById('critical-update-overlay');
                  if (!overlay && document.body) {
                    overlay = document.createElement('div');
                    overlay.id = 'critical-update-overlay';
                    overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F5C429;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:30px;';
                    overlay.innerHTML =
                      '<div style="width:50px;height:50px;border:4px solid #F5C429;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px;"></div>' +
                      '<h1 style="font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin:0;color:#FFF;">Atualizando para v' + serverVer + '</h1>' +
                      '<p style="color:#AAA;font-size:13px;margin-top:12px;max-width:280px;line-height:1.5;">Sincronizando nova versão do clube...</p>' +
                      '<button id="upd-now-btn" style="margin-top:30px;width:100%;max-width:260px;padding:16px;background:#F5C429;color:#000;border:none;border-radius:16px;font-weight:900;text-transform:uppercase;letter-spacing:1px;font-size:12px;cursor:pointer;box-shadow:0 8px 24px rgba(245,196,41,0.3);">Abrir Aplicativo</button>' +
                      '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
                    document.body.appendChild(overlay);

                    var doReload = function() {
                      // Preserva as chaves anti-loop no sessionStorage e recarrega limpo
                      sessionStorage.setItem('guerreiros_html_update_ts', String(Date.now()));
                      sessionStorage.setItem('guerreiros_html_update_target', serverVer);
                      sessionStorage.setItem('guerreiros_confirmed_version', serverVer);
                      localStorage.setItem('guerreiros_app_version', serverVer);
                      var freshUrl = window.location.origin + window.location.pathname + '?nocache=' + Date.now();
                      window.location.replace(freshUrl);
                    };

                    var btn = document.getElementById('upd-now-btn');
                    if (btn) btn.onclick = doReload;

                    setTimeout(doReload, 1500);
                  }
                }
              } catch (e) {
                console.error('[AutoUpdater] Error in HTML update script:', e);
              }
            }
          };
          xhr.send();
        }

        // Aguarda 2 segundos para que o bundle React (/index.tsx) monte e defina window.__RUNNING_APP_VERSION__
        if (document.readyState === 'complete') {
          setTimeout(runHtmlVersionCheck, 2000);
        } else {
          window.addEventListener('load', function() {
            setTimeout(runHtmlVersionCheck, 2000);
          });
        }
      })();

      if ('serviceWorker' in navigator) {
        var isReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          var lastReload = sessionStorage.getItem('last_controller_reload');
          var now = Date.now();
          if (!isReloading && (!lastReload || now - parseInt(lastReload, 10) > 60000)) {
            isReloading = true;
            sessionStorage.setItem('last_controller_reload', String(now));
            console.log('[PWA] Service worker controller changed, refreshing...');
            window.location.reload();
          }
        });
      }
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('ResizeObserver') !== -1 || e.message.indexOf('WebSocket') !== -1)) {
          return;
        }
        console.warn('Runtime error handled:', e.message || e);
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }
      });
    </script>
</body>
</html>
