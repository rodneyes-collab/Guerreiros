
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerreiros Volleyball Club v3.3.5</title>
    <meta name="description" content="Ferramenta avançada para vôlei com Ranking ELO (+20/-20) e balanceamento por Eficiência Técnica. Prioriza jogadores com menos partidas no dia para garantir rotação justa.">
    <meta property="og:title" content="Guerreiros Volleyball Club">
    <meta property="og:description" content="Ferramenta avançada para vôlei com Ranking ELO (+20/-20) e balanceamento por Eficiência Técnica. Prioriza jogadores com menos partidas no dia para garantir rotação justa.">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <script>
      // Global Gender runtime polyfill for mobile PWA standalone mode
      window.Gender = window.Gender || { MALE: 'MALE', FEMALE: 'FEMALE' };
      if (typeof globalThis !== 'undefined') {
        globalThis.Gender = globalThis.Gender || window.Gender;
      }
      if (typeof self !== 'undefined') {
        self.Gender = self.Gender || window.Gender;
      }
    </script>
</head>
<body class="bg-black text-white">
    <div id="root"></div>
    <!-- Polyfills for older devices (non-blocking) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/resize-observer/1.0.0/browser.polyfill.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/intersection-observer/0.12.2/intersection-observer.min.js"></script>
    <script>
      // Global error handler for legacy debugging
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('[LegacyError]', msg, 'at', lineNo + ':' + columnNo);
        return false;
      };

      (function() {
        var lastReload = sessionStorage.getItem('last_version_reload');
        var now = Date.now();
        if (lastReload && now - parseInt(lastReload, 10) < 15000) return;

        var currentInstalled = localStorage.getItem('guerreiros_app_version');
        
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/version?v=' + now + '&r=' + Math.random(), true);
        xhr.timeout = 5000;
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.version) {
                if (currentInstalled && currentInstalled !== data.version) {
                  console.log('[AutoUpdater] UPDATE DETECTED: ' + currentInstalled + ' -> ' + data.version);
                  
                  // Visual Feedback
                  var root = document.getElementById('root');
                  if (root) {
                    root.innerHTML = '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#F5C429;font-family:sans-serif;text-align:center;padding:20px;">' +
                      '<div style="width:50px;height:50px;border:4px solid #F5C429;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;"></div>' +
                      '<h1 style="font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:0;">Atualizando App</h1>' +
                      '<p style="color:#666;font-size:12px;margin-top:10px;">Instalando versão ' + data.version + '...</p>' +
                      '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>' +
                    '</div>';
                  }

                  localStorage.setItem('guerreiros_app_version', data.version);
                  sessionStorage.setItem('last_version_reload', String(Date.now()));
                  
                  // Unregister and Clear
                  if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(regs) {
                      if (regs) regs.forEach(function(r) { r.unregister(); });
                    });
                  }
                  if ('caches' in window && typeof caches.keys === 'function') {
                    caches.keys().then(function(names) {
                      if (names) names.forEach(function(name) { caches.delete(name); });
                    });
                  }
                  
                  setTimeout(function() {
                    window.location.href = window.location.origin + window.location.pathname + '?v_upd=' + data.version;
                  }, 1500);
                } else {
                  localStorage.setItem('guerreiros_app_version', data.version);
                }
              }
            } catch (e) {}
          }
        };
        xhr.send();
      })();

      if ('serviceWorker' in navigator) {
        var isReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          var lastReload = sessionStorage.getItem('last_controller_reload');
          var now = Date.now();
          if (!isReloading && (!lastReload || now - parseInt(lastReload, 10) > 15000)) {
            isReloading = true;
            sessionStorage.setItem('last_controller_reload', String(now));
            console.log('[PWA] Service worker controller changed, refreshing...');
            window.location.reload();
          }
        });
      }
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('ResizeObserver') !== -1 || e.message.indexOf('WebSocket') !== -1)) {
          return;
        }
        console.warn('Runtime error handled:', e.message || e);
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }
      });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
