
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerreiros - Vôlei de Elite</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
</head>
<body class="bg-black text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        var isReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!isReloading) {
            isReloading = true;
            console.log('[PWA] Service worker controller changed, reloading...');
            window.location.reload();
          }
        });
      }
      window.addEventListener('error', function(e) {
        console.error('Runtime error caught:', e);
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.zIndex = '9999';
        div.style.color = 'white';
        div.style.background = 'red';
        div.style.padding = '10px';
        div.style.fontFamily = 'monospace';
        div.textContent = 'Erro de inicialização: ' + e.message + (e.filename ? ' em ' + e.filename : '');
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e);
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.bottom = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.zIndex = '9999';
        div.style.color = 'white';
        div.style.background = 'orange';
        div.style.padding = '10px';
        div.style.fontFamily = 'monospace';
        div.textContent = 'Erro de promessa: ' + (e.reason ? e.reason.message || e.reason : 'Desconhecido');
        document.body.appendChild(div);
      });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
